        }
        .counter-box {

            font-size: 14px;

        }
        .gallery {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

        }
        .gallery img {

        }
        .back-link a {
            color: #ffd700;

            text-decoration: none;

        }
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <script>
    async function loadCounter() {
        // Automatically detect page filename for the database key
        const pageId = window.location.pathname.split("/").pop().replace(".html", "") || "index";

        try {
            // Replace with your actual deployed Java backend URL
            const response = await fetch(`https://your-java-server-domain.com/api/counter?pageId=${pageId}`, {
                method: 'POST'
            });
            const data = await response.json();
            document.getElementById('page-counter').textContent = data.count;
        } catch (err) {
            console.error('Failed to load live view count from Java backend', err);
            document.getElementById('page-counter').textContent = '--';
        }
    }

    loadCounter();
    </script>
