<script>
(async function() {
    try {
        // Automatically create a clean page identifier from the URL path
        const pageId = 'nellyi_' + window.location.pathname.replace(/[^a-zA-Z0-9]/g, '_');
        
        // Fetch from your Java backend endpoint (POST method to trigger the increment)
        const res = await fetch(`https://your-java-server-domain.com/api/counter?pageId=${pageId}`, {
            method: 'POST'
        });
        
        if (res.ok) {
            const data = await res.json();
            const el = document.getElementById('view-count');
            if (el && data.count !== undefined) {
                el.textContent = data.count;
            }
        }
    } catch (e) {
        console.error('Counter error:', e);
        const el = document.getElementById('view-count');
        if (el) {
            el.textContent = '--';
        }
    }
})();
</script>
