<script>
  (async function() {
    try {
      // Clean identifier based on the page name
      const pageId = 'nellyi_' + window.location.pathname.replace(/[^a-zA-Z0-9]/g, '_');
      
      // Using a reliable public JSON counter endpoint
      const res = await fetch(`https://api.counterapi.dev/v1/nellyi/pages_${pageId}/up`);
      if (res.ok) {
        const data = await res.json();
        const el = document.getElementById('view-count');
        if (el && data.count) {
          el.textContent = data.count;
        }
      }
    } catch (e) {
      console.error('Counter error:', e);
    }
  })();
</script>
