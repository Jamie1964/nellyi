<script>
  // Clean, automated public counter API that requires no backend setup
  async function updateGlobalCounter() {
    try {
      // Use a unique namespace/key for your site
      const namespace = 'nellyi-com';
      const key = encodeURIComponent(window.location.pathname);
      
      // Hits the free API to increment and fetch the count simultaneously
      const response = await fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`);
      if (response.ok) {
        const data = await response.json();
        const countEl = document.getElementById('view-count');
        if (countEl) {
          countEl.textContent = data.count;
        }
      }
    } catch (err) {
      console.error('Failed to load view count', err);
    }
  }

  updateGlobalCounter();
</script>
