<footer>

  <p>Website by: <a href="https://jamiespages.com">jamiespages.com</a></p>
  <p>Last updated: August 5, 2026 — 12:23</p>
  <p>Views: <span id="view-count">--</span></p>
</footer>

<script>
  // Use a unique key per page path so each page tracks its own views locally
  const storageKey = 'page_views_' + window.location.pathname;
  
  // Get current count from localStorage, default to 0 if it doesn't exist
  let views = parseInt(localStorage.getItem(storageKey)) || 0;
  
  // Increment the count for this visit
  views++;
  
  // Save the updated count back to localStorage
  localStorage.setItem(storageKey, views);
  
  // Display the count in the footer element
  document.getElementById('view-count').textContent = views;
</script>
