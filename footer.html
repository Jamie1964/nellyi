<script>
(async function() {
    try {
        let path = window.location.pathname;
        if (path.endsWith('/')) path = path.slice(0, -1);
        let filename = path.split('/').pop();
        let pageId = filename ? filename.replace('.html', '') : 'index';
        if (!pageId) pageId = 'index';
        
        const namespace = 'nellyi_site';
        const key = pageId;
        
        // Try to increment the hit count
        let res = await fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`);
        
        // If the counter doesn't exist yet, create it first, then increment
        if (!res.ok) {
            await fetch(`https://api.counterapi.dev/v1/${namespace}/${key}`);
            res = await fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`);
        }
        
        if (res.ok) {
            const data = await res.json();
            const el = document.getElementById('view-count');
            if (el && data.count !== undefined) {
                el.textContent = data.count;
            } else {
                document.getElementById('view-count').textContent = '1';
            }
        } else {
            document.getElementById('view-count').textContent = '1';
        }
    } catch (e) {
        console.error('Counter error:', e);
        const el = document.getElementById('view-count');
        if (el) {
            el.textContent = '1';
        }
    }
})();
</script>
